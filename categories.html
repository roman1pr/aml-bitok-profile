<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Доступ по коду</title>
<style>
:root { --bg: #f3f5f4; --surface: #ffffff; --ink: #18201f; --muted: #5a6866; --line: #d6dddb; --accent: #0e5a63; --err: #a8231b; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111716; --surface: #182120; --ink: #e4ebe9; --muted: #9aaba8; --line: #2c3a38; --accent: #6cc3cc; --err: #f08a80; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding-inline: 16px; }
form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 12px; }
h1 { font-size: 18px; margin: 0; }
label { font-size: 14px; color: var(--muted); }
input { font: 16px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--surface); cursor: pointer; }
button[disabled] { opacity: 0.6; cursor: progress; }
.err { color: var(--err); font-size: 14px; min-height: 1.5em; margin: 0; }
</style>
</head>
<body>
<form id="gate" hidden>
  <h1>Введите код доступа</h1>
  <label for="code">Код</label>
  <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
  <button id="go" type="submit">Открыть</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>

  var form = document.getElementById("gate"), input = document.getElementById("code");
  var err = document.getElementById("err"), btn = document.getElementById("go");
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function toB64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function store(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  async function derive(code) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveBits"]);

  async function open(raw) {
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
    return new TextDecoder().decode(plain);
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  async function start() {
    if (!window.crypto || !crypto.subtle) { form.hidden = false; err.textContent = "Браузер не поддерживает расшифровку. Откройте страницу по https."; btn.disabled = true; return; }
    var saved = load(KEY_NAME);
    if (saved) { try { show(await open(b64(saved))); return; } catch (e) { store(KEY_NAME, null); } }
    form.hidden = false; input.focus();
  }
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.textContent = ""; btn.disabled = true; btn.textContent = "Проверяю…";
    try {
      var raw = await derive(input.value.trim().toUpperCase());
      var html = await open(raw);
      store(KEY_NAME, toB64(raw));
      show(html);
    } catch (x) {
      btn.disabled = false; btn.textContent = "Открыть";
      err.textContent = "Неверный код. Проверьте его и попробуйте ещё раз.";
