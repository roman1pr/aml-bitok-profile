<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Доступ по коду</title>
<style>
:root { --bg: #f3f5f4; --surface: #ffffff; --ink: #18201f; --muted: #5a6866; --line: #d6dddb; --accent: #0e5a63; --err: #a8231b; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111716; --surface: #182120; --ink: #e4ebe9; --muted: #9aaba8; --line: #2c3a38; --accent: #6cc3cc; --err: #f08a80; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding-inline: 16px; }
form { width: min(360px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 12px; }
h1 { font-size: 18px; margin: 0; }
label { font-size: 14px; color: var(--muted); }
input { font: 16px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; padding: 10px 12px; border: 0; border-radius: 8px; background: var(--accent); color: var(--surface); cursor: pointer; }
button[disabled] { opacity: 0.6; cursor: progress; }
.err { color: var(--err); font-size: 14px; min-height: 1.5em; margin: 0; }
</style>
</head>
<body>
<form id="gate" hidden>
  <h1>Введите код доступа</h1>
  <label for="code">Код</label>
  <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
  <button id="go" type="submit">Открыть</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>
